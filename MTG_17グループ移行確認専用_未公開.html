<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MTG 17グループ移行確認（未公開）</title><style>body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#f4f5f7;color:#1d2330;margin:0}main{max-width:640px;margin:auto;padding:20px}h1{font-size:21px}.banner{background:#7f1d1d;color:white;padding:12px;text-align:center;font-weight:bold}.card{background:white;border-radius:12px;padding:16px;margin:12px 0}input,button{font:inherit;padding:12px;border-radius:8px;box-sizing:border-box}input{width:100%;border:1px solid #bbb}button{background:#155e75;color:white;border:0;margin-top:10px;cursor:pointer}small{color:#555}li{margin:12px 0}.error{color:#b91c1c;white-space:pre-wrap}</style></head><body><div class="banner">検証専用・未公開｜読み取りのみ・変更不可</div><main><h1>17グループ移行確認</h1><p>テスト用Firebaseの <code>admins_migration_test</code> / <code>groups_migration_test</code> を読み取る確認専用ページです。データの作成・編集・削除はできません。</p><div id="status" class="card">認証を確認しています…</div><div id="login" class="card" hidden><label>テスト認証に使用したメールアドレス<input type="email" id="email" autocomplete="email"></label><button id="send">認証メールを送る</button></div><div id="check" class="card" hidden><label>移行後の管理ページのドキュメントID<input id="adminId" placeholder="admins_migration_test のドキュメントID"></label><button id="load">17グループを確認</button><small><p>管理者本人の認証とFirestoreの権限設定が必要です。移行前やルール未設定の段階では読み取れません。</p></small></div><div id="result"></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,onAuthStateChanged,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyBGOwjQb5lozlKnrGr_Rgg_SR6vbc5cN-A',authDomain:'mtg-schedule-test.firebaseapp.com',projectId:'mtg-schedule-test',storageBucket:'mtg-schedule-test.firebasestorage.app',messagingSenderId:'703817916112',appId:'1:703817916112:web:ec7d70b5bd284f790b48d5'});
const db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emailKey='mtg_migration_preview_email';
function status(t){$('status').textContent=t}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return;try{await sendSignInLinkToEmail(auth,email,{url:location.origin+location.pathname+location.search,handleCodeInApp:true});localStorage.setItem(emailKey,email);status('認証メールを送信しました。メールのリンクを開いてください。')}catch(e){status('送信エラー：'+e.code)}};
$('load').onclick=async()=>{const id=$('adminId').value.trim();if(!id)return;status('確認中…');$('result').innerHTML='';try{const s=await getDoc(doc(db,'admins_migration_test',id));if(!s.exists())throw Error('管理者ドキュメントが見つかりません');const a=s.data();if(a.ownerUid!==auth.currentUser.uid)throw Error('管理者UIDが一致しません');if(!Array.isArray(a.groups)||a.groups.length!==17)throw Error('管理一覧の件数が17ではありません：'+(a.groups?.length??'不明'));const ids=a.groups.map(g=>g.gid);if(new Set(ids).size!==17)throw Error('グループIDが重複しています');const rows=await Promise.all(a.groups.map(async g=>{const x=await getDoc(doc(db,'groups_migration_test',g.gid));if(!x.exists())throw Error('グループが見つかりません：'+g.gid);const d=x.data();return {name:d.name||g.name,meetings:d.meetings?.length??0}}));const count=rows.reduce((n,r)=>n+r.meetings,0);status('読み取り成功：17グループ／予定 '+count+' 件。内容を確認してください。');$('result').innerHTML='<div class="card"><h2>移行データ一覧（読み取り専用）</h2><ol>'+rows.map(r=>'<li>'+esc(r.name)+' <small>予定 '+r.meetings+' 件</small></li>').join('')+'</ol></div>'}catch(e){status('読み取りできません：'+(e.code||e.message)+'。移行前やルール未設定の場合は正常な状態です。')}};
(async()=>{if(isSignInWithEmailLink(auth,location.href)){let email=localStorage.getItem(emailKey)||prompt('認証メールを受け取ったアドレスを入力してください');if(email){try{await signInWithEmailLink(auth,email,location.href);localStorage.removeItem(emailKey);const u=new URL(location.href);['apiKey','oobCode','mode','lang','continueUrl','tenantId'].forEach(k=>u.searchParams.delete(k));history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(e){status('認証エラー：'+e.code)}}}onAuthStateChanged(auth,user=>{const ok=!!(user&&!user.isAnonymous&&user.emailVerified);$('login').hidden=ok;$('check').hidden=!ok;status(ok?'認証済み。移行後に管理ドキュメントIDを入力して確認できます。':'メール認証が必要です。');if(ok){$('adminId').value=new URLSearchParams(location.search).get('admin')||''}})})();
</script></body></html>
