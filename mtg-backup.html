<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MTGスケジュール・バックアップ</title><style>body{font-family:system-ui,'Meiryo',sans-serif;background:#f5f6f8;color:#202733;margin:0;padding:24px}main{max-width:650px;margin:auto;background:white;border-radius:14px;padding:24px;box-shadow:0 1px 8px #0001}h1{font-size:22px}p{line-height:1.7}label{display:block;font-weight:bold;margin:20px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:15px}button{background:#0e7c66;color:white;border:0;border-radius:8px;padding:13px 20px;font-weight:bold;margin-top:14px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{white-space:pre-wrap;line-height:1.6}small{color:#555}</style></head><body><main><h1>MTGスケジュール バックアップ</h1><p>管理ページに登録されたグループと会議日程を読み取り、JSONファイルとして保存します。<strong>Firebaseへの書き込み・変更・削除は行いません。</strong></p><p><small>このページは管理ページURLを外部送信しません。Firebaseへのデータ読み取りにだけ利用します。バックアップには氏名や会議URLが含まれるため、保存したファイルを第三者に渡さないでください。</small></p><label for="url">管理ページのURL（他人には共有しないでください）</label><input id="url" type="password" autocomplete="off" placeholder="https://shooo-art.github.io/mtg-schedule/?admin=..."><button id="go">バックアップを作成する</button><p id="status" role="status"></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyAngh-KTkoC1o0PqcV46WuCDeugzQnudG0',authDomain:'mtg-schedule-5d7eb.firebaseapp.com',projectId:'mtg-schedule-5d7eb',storageBucket:'mtg-schedule-5d7eb.firebasestorage.app',messagingSenderId:'351237460352',appId:'1:351237460352:web:6b0ae37b2287ff9f2c7165'});
const db=getFirestore(app),button=document.getElementById('go'),status=document.getElementById('status');
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='確認しています…';try{
const u=new URL(document.getElementById('url').value.trim());if(u.origin!=='https://shooo-art.github.io'||u.pathname.replace(/\/$/,'')!=='/mtg-schedule'||!u.searchParams.get('admin'))throw Error('正しい管理ページURLを入力してください。');
const key=u.searchParams.get('admin');if(!/^[A-Za-z0-9]{28}$/.test(key))throw Error('管理ページURLのIDを確認してください。');
const adminSnap=await getDoc(doc(db,'admins',key));if(!adminSnap.exists())throw Error('管理ページが見つかりません。');
const admin=adminSnap.data(),entries=admin.groups;if(!Array.isArray(entries))throw Error('管理ページのグループ一覧を取得できません。');
const unique=new Set(),groups={};for(let i=0;i<entries.length;i++){const item=entries[i];if(typeof item.gid!=='string'||!item.gid||unique.has(item.gid))throw Error('グループIDに重複または不正な値があります。');unique.add(item.gid);status.textContent=`読み取り中… ${i+1} / ${entries.length}`;const snap=await getDoc(doc(db,'groups',item.gid));if(!snap.exists())throw Error(`${i+1}番目のグループが見つかりません。バックアップは作成しません。`);groups[item.gid]=snap.data();}
const payload={format:'mtg-schedule-backup-v1',exportedAt:new Date().toISOString(),projectId:'mtg-schedule-5d7eb',admin:{groups:entries,createdAt:admin.createdAt??null},groups};
const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const link=document.createElement('a');const name='MTGスケジュール_バックアップ_'+new Date().toLocaleDateString('sv-SE')+'.json';const href=URL.createObjectURL(blob);link.href=href;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(href),30000);status.textContent=`完了：${entries.length}グループのJSONファイルを作成しました。ダウンロードしたファイルをバックアップフォルダーに保管してください。`;document.getElementById('url').value='';
}catch(e){console.error(e);status.textContent='バックアップ未完了：'+(e?.message||'読み取りに失敗しました。');}finally{button.disabled=false;}});
</script></body></html>
