<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本番管理者認証確認</title><style>body{font:16px system-ui;background:#f1f5f4;margin:0}main{max-width:560px;margin:48px auto;background:white;padding:24px;border-radius:16px}button,input{font:inherit;padding:12px;margin:8px 0;box-sizing:border-box;width:100%}button{background:#087b68;color:white;border:0;border-radius:8px}#status{white-space:pre-wrap}</style><main><h1>本番管理者認証確認</h1><p>認証のみ。Firestoreの日程・権限は変更しません。</p><input id="email" type="email" placeholder="管理者メールアドレス"><button id="send" disabled>認証メールを送る</button><p id="status">準備中…</p><button id="logout" hidden>ログアウト</button></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const firebaseConfig = {
  apiKey: "AIzaSyAngh-KTkoC1o0PqcV46WuCDeugzQnudG0",
  authDomain: "mtg-schedule-5d7eb.firebaseapp.com",
  projectId: "mtg-schedule-5d7eb",
  storageBucket: "mtg-schedule-5d7eb.firebasestorage.app",
  messagingSenderId: "351237460352",
  appId: "1:351237460352:web:6b0ae37b2287ff9f2c7165"
};
const auth=getAuth(initializeApp(firebaseConfig)); const expected="6PYREFOOrpMDYmolNDho281f2Py2";
const $=id=>document.getElementById(id), status=s=>$('status').textContent=s, key='mtg_prod_admin_verify_email';
async function start(){
if(isSignInWithEmailLink(auth,location.href)){try{const email=localStorage.getItem(key)||prompt('認証に使用したメールアドレス');if(!email)throw new Error('メールアドレスが必要です');await signInWithEmailLink(auth,email,location.href);localStorage.removeItem(key);history.replaceState(null,'',location.pathname);}catch(e){status('認証失敗：'+(e.code||e.message));return;}}
onAuthStateChanged(auth,u=>{const ok=u&&u.emailVerified&&u.uid===expected;status(ok?'管理者本人確認成功（UID一致・メール確認済み）':u?'管理者本人確認未完了（UIDまたはメール確認状態が不一致）':'管理者メールアドレスを入力してください。');$('send').disabled=!!ok;$('logout').hidden=!u;});
}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!$('email').checkValidity()||!email)return; $('send').disabled=true;try{await sendSignInLinkToEmail(auth,email,{url:location.origin+location.pathname,handleCodeInApp:true});localStorage.setItem(key,email);status('送信しました。同じChromeプロフィールでメールリンクを開いてください。');}catch(e){status('送信失敗：'+e.code);$('send').disabled=false;}};
$('logout').onclick=()=>signOut(auth);start().catch(e=>status(e.code||e.message));</script></html>
