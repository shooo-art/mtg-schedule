<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MTG テスト移行専用</title><style>body{font:16px system-ui;background:#f4f5f7;color:#172033;max-width:680px;margin:30px auto;padding:16px}section{background:white;padding:20px;border-radius:12px;margin:12px 0}button,input{font:inherit;padding:10px;margin:8px 0;max-width:100%}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:24px}</style><h1>MTG テスト環境専用・一括移行</h1><section>移行先：mtg-schedule-test の migration_test コレクションのみ。<br>本番への書き込み機能はありません。</section><section><div id="status">認証確認中</div><input id="email" type="email" placeholder="管理者用Gmail"><button id="send">認証メールを送る</button><button id="logout">ログアウト</button></section><section><input id="file" type="file" accept=".json,application/json"><button id="preview">登録前確認（読み取りのみ）</button><pre id="result"></pre><button id="commit" disabled>17グループをテスト環境に登録</button></section><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,doc,runTransaction,getDocFromServer} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getAuth,onAuthStateChanged,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyBGOwjQb5lozlKnrGr_Rgg_SR6vbc5cN-A',authDomain:'mtg-schedule-test.firebaseapp.com',projectId:'mtg-schedule-test',storageBucket:'mtg-schedule-test.firebasestorage.app',messagingSenderId:'703817916112',appId:'1:703817916112:web:ec7d70b5bd284f790b48d5'});
const db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id),aid='4CKMtw7EDe2XuZkRkkeEvWPHxCYE',ar=doc(db,'admins_migration_test',aid);let ready=null;const reset=()=>{ready=null;$('commit').disabled=true};const msg=t=>$('result').textContent=t;
function user(){const u=auth.currentUser;if(!u||!u.emailVerified||u.isAnonymous)throw Error('管理者のメール認証が必要です');return u}
function validate(d){if(d.source?.projectId!=='mtg-schedule-5d7eb'||d.adminDocumentIdFromSource!==aid||d.targetCollections?.admins!=='admins_migration_test'||d.targetCollections?.groups!=='groups_migration_test')throw Error('移行元・移行先が一致しません');const a=d.admin?.groups;if(!Array.isArray(a)||a.length!==17||!d.groups||Object.keys(d.groups).length!==17)throw Error('17件ではありません');const ids=a.map(g=>g.gid);if(new Set(ids).size!==17||ids.some(id=>typeof id!=='string'||!/^[A-Za-z0-9_-]+$/.test(id)))throw Error('ID異常');let n=0;for(const g of a){const x=d.groups[g.gid];if(!x||x.name!==g.name||!Array.isArray(x.members)||!Array.isArray(x.meetings))throw Error('グループ内容不一致');n+=x.meetings.length}if(n!==15)throw Error('予定が15件ではありません');return a}
function checkAdmin(s,u){if(!s.exists()||s.data().ownerUid!==u.uid||!Array.isArray(s.data().groups)||s.data().groups.length!==0)throw Error('管理者不一致または登録済み');}
$('file').onchange=()=>{reset();msg('ファイル選択済み。登録前確認を押してください')};
$('send').onclick=async()=>{try{const e=$('email').value.trim();await sendSignInLinkToEmail(auth,e,{url:location.origin+location.pathname,handleCodeInApp:true});localStorage.setItem('mtg_import_email',e);msg('認証メール送信済み')}catch(e){msg(e.message)}};
$('logout').onclick=async()=>{reset();await signOut(auth)};
if(isSignInWithEmailLink(auth,location.href)){try{const e=localStorage.getItem('mtg_import_email')||prompt('認証メールのアドレス');if(e){await signInWithEmailLink(auth,e,location.href);localStorage.removeItem('mtg_import_email');history.replaceState(null,'',location.pathname)}}catch(e){msg(e.message)}}
onAuthStateChanged(auth,u=>{reset();$('status').textContent=u?.emailVerified?'認証済み：'+u.email:'メール認証が必要です'});
$('preview').onclick=async()=>{reset();try{const u=user(),f=$('file').files[0];if(!f)throw Error('JSONを選択してください');const d=JSON.parse(await f.text()),a=validate(d);checkAdmin(await getDocFromServer(ar),u);ready={d,a,uid:u.uid};msg('確認成功：17グループ／15予定。管理者一致・管理一覧は空。\nまだ書き込んでいません。\n'+a.map(g=>g.name+'：'+d.groups[g.gid].meetings.length+'件').join('\n'));$('commit').disabled=false}catch(e){msg('確認失敗：'+e.message)}};
$('commit').onclick=async()=>{const r=ready;if(!r)return;if(!confirm('移行専用の上書き禁止ルールを公開済みですか？ テスト環境に17グループを登録します。'))return;reset();try{const u=user();if(u.uid!==r.uid)throw Error('認証が変わりました');await runTransaction(db,async tx=>{checkAdmin(await tx.get(ar),u);for(const g of r.a){const ref=doc(db,'groups_migration_test',g.gid);tx.set(ref,{...r.d.groups[g.gid],ownerUid:u.uid,adminId:aid})}tx.update(ar,{groups:r.a})});msg('登録成功：17グループ／15予定。確認専用ページで照合してください。')}catch(e){msg('登録失敗：'+e.message+'。再実行前に状態を確認してください。')}};
</script></html>
