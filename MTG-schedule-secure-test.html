<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>【権限テスト専用】打ち合わせ日程</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1d2330; --sub:#6b7280; --line:#e5e7eb;
    --accent:#0e7c66; --accent-soft:#e3f4ef; --out:#c2410c; --out-soft:#fdecea;
    --warn:#b45309; --warn-soft:#fff4dc; --line-green:#06c755;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    -webkit-text-size-adjust:100%;}
  body{padding-bottom:env(safe-area-inset-bottom)}
  #app{max-width:640px;margin:0 auto;padding:16px 14px 80px}
  button{font:inherit;cursor:pointer}
  .loading{padding:60px 0;text-align:center;color:var(--sub)}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:4px 2px 12px}
  header.top h1{font-size:21px;margin:0;line-height:1.35;word-break:break-word}
  header.top .kicker{font-size:12px;color:var(--sub);margin-bottom:2px}
  .me{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
  .hint{background:var(--accent-soft);color:#0b5345;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:12px}
  .btn{border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:#fff;color:var(--out);border:1px solid #f3c4b5}
  .btn.danger.armed{background:var(--out);color:#fff}
  .btn.line{background:var(--line-green);color:#fff;text-decoration:none;display:inline-block;text-align:center}
  .btn.block{display:block;width:100%}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
  .section-title{font-size:13px;color:var(--sub);font-weight:600;margin:20px 4px 8px}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);border:2px solid transparent}
  .card.changed{border-color:#f5c86b}
  .when{font-size:20px;font-weight:700;letter-spacing:.01em}
  .when .dow{font-size:15px;margin-left:1px}
  .when .time{font-size:17px;margin-left:8px}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;vertical-align:middle;margin-left:6px}
  .badge.changed{background:var(--warn-soft);color:var(--warn)}
  .badge.today{background:var(--accent);color:#fff}
  .place,.memo{font-size:14px;margin-top:6px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .memo{color:var(--sub)}
  .joinurl{margin-top:10px;background:#eef4ff;border:1px solid #c7d7fe;border-radius:12px;padding:10px}
  .joinurl .jt{font-size:12px;font-weight:700;color:#1e40af;margin-bottom:6px}
  .joinurl a.open{display:block;text-align:center;background:#2563eb;color:#fff;text-decoration:none;font-size:16px;font-weight:700;border-radius:10px;padding:12px 10px}
  .joinurl .jh{font-size:12px;color:#1e3a8a;margin-top:6px;line-height:1.5}
  .joinurl .ur{display:flex;align-items:center;gap:8px;margin-top:6px}
  .joinurl .u{font-size:11px;color:#64748b;word-break:break-all;line-height:1.4;flex:1;min-width:0}
  .joinurl button{flex-shrink:0;border:1px solid #c7d7fe;background:#fff;color:#1e40af;font-size:12px;border-radius:8px;padding:5px 8px}
  .people{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{border:1px solid #b9e2d6;background:var(--accent-soft);color:#0b5345;border-radius:999px;padding:7px 12px;font-size:14px;line-height:1}
  .chip.out{border-color:#f3c4b5;background:var(--out-soft);color:var(--out);text-decoration:line-through}
  .chip .mark{font-weight:700;margin-left:4px;text-decoration:none;display:inline-block}
  .notice{background:var(--warn-soft);color:#7c4a03;border:1px solid #f5d38a;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:12px}
  .notice b{color:#92400e}
  .absent-hint{margin-top:10px;font-size:13px;line-height:1.5;color:var(--out);background:var(--out-soft);border-radius:10px;padding:8px 10px}
  .absent-hint b{font-weight:700}
  .count{font-size:12px;color:var(--sub);margin-top:8px}
  .meta{font-size:11px;color:var(--sub);margin-top:4px}
  .card .actions{margin-top:10px;display:flex;gap:8px}
  .empty{text-align:center;color:var(--sub);padding:28px 10px;background:#fff;border-radius:16px;font-size:14px;line-height:1.7}
  details.past{margin-top:16px}
  details.past summary{font-size:13px;color:var(--sub);padding:8px 4px;cursor:pointer}
  details.past .card{opacity:.75}
  .footer-links{margin-top:22px;display:flex;flex-direction:column;gap:8px}
  /* admin */
  .grow{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .grow .gname{font-weight:700;font-size:16px}
  .grow .next{font-size:14px;margin-top:4px}
  .grow .none{color:var(--sub)}
  .grow .change{font-size:12px;margin-top:6px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 8px}
  .grow .row-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .grow .row-actions a{text-decoration:none}
  .warnbox{background:var(--warn-soft);color:#7c4a03;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:12px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .modal.hidden{display:none}
  .sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  @media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
  .sheet h2{font-size:18px;margin:0 0 12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
  .field input[type=text],.field input[type=date],.field input[type=time],.field textarea{
    width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none;min-height:44px}
  .field textarea{min-height:80px;resize:vertical}
  .two{display:flex;gap:10px}.two>.field{flex:1}
  .checks{display:flex;flex-wrap:wrap;gap:6px}
  .checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;color:var(--ink);font-weight:400;margin:0}
  .checks input{width:16px;height:16px;margin:0}
  .addname{display:flex;gap:6px;margin-top:8px}.addname input{flex:1}
  .sheet .btns{display:flex;gap:8px;margin-top:16px}.sheet .btns .btn{flex:1}
  .preview{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-wrap;line-height:1.6;word-break:break-all}
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
  .pick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px}
  .urlbox{font-size:12px;word-break:break-all;background:var(--bg);padding:8px 10px;border-radius:8px;margin:8px 0}
  .linkbtn{background:none;border:none;color:var(--accent);font-size:13px;padding:4px 0;text-decoration:underline}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
  .toast.hidden{display:none}
</style>
</head>
<body>
<div style="position:sticky;top:0;z-index:80;background:#8b1e1e;color:white;padding:10px;text-align:center;font-weight:bold">🔐 権限テスト専用（本番・旧テストのデータは表示されません）</div>
<div id="app"><div class="loading">テスト環境に接続中…</div></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot,runTransaction,collection,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBGOwjQb5lozlKnrGr_Rgg_SR6vbc5cN-A",
    authDomain: "mtg-schedule-test.firebaseapp.com",
    projectId: "mtg-schedule-test",
    storageBucket: "mtg-schedule-test.firebasestorage.app",
    messagingSenderId: "703817916112",
    appId: "1:703817916112:web:ec7d70b5bd284f790b48d5"
  };

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
// 権限テスト専用。従来のテストデータには触れません。
const ADMINS = 'admins_secure_test';
const GROUPS = 'groups_secure_test';

/* ---------- 小さな道具 ---------- */
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const $toast = document.getElementById('toast');
const DOW = ['日','月','火','水','木','金','土'];
const DAY = 86400000;
const CHANGED_DAYS = 3;   // 「変更あり」を表示する日数

const params = new URLSearchParams(location.search);
const GID = params.get('g');
const ADMIN = params.get('admin');
const BASE = location.origin + location.pathname;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rid(n){
  const chars = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a = new Uint32Array(n); crypto.getRandomValues(a);
  return Array.from(a, x => chars[x % chars.length]).join('');
}
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDate(s){
  if(!s) return '';
  const [y,m,d] = s.split('-').map(Number);
  const dow = DOW[new Date(y, m-1, d).getDay()];
  const yr = y !== new Date().getFullYear() ? `${y}/` : '';
  return `${yr}${m}/${d}(${dow})`;
}
const fmtWhen = m => `${fmtDate(m.date)}${m.time ? ' ' + m.time : ''}`;
function fmtStamp(t){ if(!t) return ''; const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }
const cmpMeet = (a,b) => (a.date + (a.time||'99:99')).localeCompare(b.date + (b.time||'99:99'));
const groupUrl = g => `${BASE}?g=${g}&openExternalBrowser=1`;
const adminUrl = k => `${BASE}?admin=${k}&openExternalBrowser=1`;
const lineShare = text => `https://line.me/R/share?text=${encodeURIComponent(text)}`;
const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
// スマホ：LINEアプリの送信画面を開く／パソコン：文章をコピーしてPC版LINEに貼ってもらう
function shareButtons(text, lineLabel, closeLabel){
  if(IS_MOBILE){
    return `<div class="btns"><a class="btn line" href="${esc(lineShare(text))}" target="_blank" rel="noopener" id="ln">📩 ${lineLabel}</a></div>
      <div class="btns"><button class="btn ghost" id="cp">文章をコピー</button><button class="btn ghost" id="cl">${closeLabel}</button></div>`;
  }
  return `<div class="btns"><button class="btn line" id="cp">📋 文章をコピー</button></div>
    <div class="meta" style="margin-top:6px">パソコンの場合は、コピーした文章をパソコン版LINEのグループに貼り付けて送ってください。</div>
    <div class="btns"><button class="btn ghost" id="cl">${closeLabel}</button></div>`;
}
const isUrl = u => /^https?:\/\/\S+$/i.test(String(u || '').trim());
function meetService(u){
  const h = String(u || '').toLowerCase();
  if(h.includes('zoom.us') || h.includes('zoom.com')) return 'Zoom';
  if(h.includes('meet.google')) return 'Google Meet';
  if(h.includes('teams.microsoft') || h.includes('teams.live')) return 'Teams';
  if(h.includes('webex')) return 'Webex';
  return '';
}
const placeLine = m => `${fmtWhen(m)}${m.place ? '　' + m.place : ''}`;
const urlLine = m => m.url ? `\n💻 オンライン参加はこちら（時間になったら押してください）\n${m.url}` : '';
const isRecent = t => t && (Date.now() - t) < CHANGED_DAYS * DAY;

function toast(msg){
  $toast.textContent = msg; $toast.classList.remove('hidden');
  clearTimeout(toast._t); toast._t = setTimeout(() => $toast.classList.add('hidden'), 2600);
}
function openModal(html){ $modal.innerHTML = `<div class="sheet">${html}</div>`; $modal.classList.remove('hidden'); }
function closeModal(){ $modal.classList.add('hidden'); $modal.innerHTML = ''; }
$modal.addEventListener('click', e => { if(e.target === $modal) closeModal(); });

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('コピーしました'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); toast('コピーしました'); }catch(_){ toast('コピーできませんでした'); }
    ta.remove();
  }
}
function splitNames(text){
  return [...new Set(String(text).split(/[\n,、，]/).map(s => s.trim()).filter(Boolean))];
}
function showError(e){ console.error(e); toast('保存できませんでした。通信状況を確認してもう一度お試しください'); }

/* ---------- メールリンク認証（テスト専用） ---------- */
// メールリンクの遷移先には元の ?g= / ?admin= を残す。
// ブラウザをまたぐ場合は本人にメールアドレスを再入力してもらう。
const auth = getAuth(app);
  auth.languageCode = 'ja';
const EMAIL_KEY = 'mtg_secure_test_signin_email';
let started = false;
let authBusy = false;

function authErrorText(e){
  console.error('メール認証エラー', e);
  const code = e?.code || '';
  if(code === 'auth/invalid-email') return 'メールアドレスの形式を確認してください。';
  if(code === 'auth/too-many-requests') return '操作回数が多いため、少し時間をおいてお試しください。';
  if(code === 'auth/invalid-action-code' || code === 'auth/expired-action-code') return '認証リンクの有効期限が切れたか、使用済みです。もう一度メールを送信してください。';
  if(code === 'auth/unauthorized-continue-uri' || code === 'auth/invalid-continue-uri') return 'Firebaseの「承認済みドメイン」に shooo-art.github.io が登録されているか確認してください。';
  return `認証できませんでした（${code || '通信エラー'}）。再度お試しください。`;
}
function renderEmailLogin(message = ''){
  $app.innerHTML = `
    <header class="top"><div><div class="kicker">テスト専用・初回認証</div><h1>メールでログイン</h1></div></header>
    <div class="hint">初回だけメールで本人確認します。パスワードは不要です。届いたメールのリンクを押してください。</div>
    ${message ? `<div class="notice">${esc(message)}</div>` : ''}
    <div class="card">
      <div class="field"><label for="loginEmail">メールアドレス</label>
      <input type="email" id="loginEmail" autocomplete="email" inputmode="email" placeholder="example@example.com" style="width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px"></div>
      <button class="btn primary block" id="sendEmailLink">認証メールを送る</button>
      <div class="meta" style="margin-top:12px;line-height:1.7">メールが届かない場合は迷惑メールフォルダも確認してください。リンクは一度だけ使用できます。</div>
    </div>`;
  const input = document.getElementById('loginEmail');
  const button = document.getElementById('sendEmailLink');
  try { input.value = localStorage.getItem(EMAIL_KEY) || ''; } catch (_) {}
  button.onclick = async () => {
    const email = input.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('正しいメールアドレスを入力してください'); return; }
    button.disabled = true; button.textContent = '送信中…';
    try {
      await sendSignInLinkToEmail(auth, email, {
        url: location.origin + location.pathname + location.search,
        handleCodeInApp: true
      });
      try { localStorage.setItem(EMAIL_KEY, email); } catch (_) {}
      $app.innerHTML = `<header class="top"><h1>認証メールを送信しました</h1></header>
        <div class="hint">${esc(email)} に届いたメールのリンクを押してください。<br>リンクを開いた後は、日程調整ページに進みます。</div>
        <button class="btn ghost block" id="retryEmail">メールを再送する・アドレスを変更する</button>`;
      document.getElementById('retryEmail').onclick = () => renderEmailLogin();
    } catch (e) {
      renderEmailLogin(authErrorText(e));
    }
  };
}
async function finishEmailLink(){
  if(!isSignInWithEmailLink(auth, location.href)) return false;
  $app.innerHTML = '<div class="loading">メール認証を確認しています…</div>';
  let email = '';
  try { email = localStorage.getItem(EMAIL_KEY) || ''; } catch (_) {}
  if(!email) email = (prompt('認証メールを受け取ったメールアドレスを入力してください') || '').trim();
  if(!email){ renderEmailLogin('認証に使ったメールアドレスを入力して、もう一度リンクを開いてください。'); return true; }
  try {
    await signInWithEmailLink(auth, email, location.href);
    try { localStorage.removeItem(EMAIL_KEY); } catch (_) {}
    // 認証用の使い捨てコードだけをURLから除き、グループ・管理者IDは維持する。
    const clean = new URL(location.href);
    ['apiKey','oobCode','mode','lang','continueUrl','tenantId'].forEach(k => clean.searchParams.delete(k));
    history.replaceState(null, '', clean.pathname + clean.search + clean.hash);
  } catch (e) { renderEmailLogin(authErrorText(e)); }
  return true;
}
function launchApp(){
  if(started) return;
  started = true;
  if(GID) initGroup(GID);
  else if(ADMIN) initAdmin(ADMIN);
  else renderSetup();
}
async function initEmailAuth(){
  // 以前のテストで作られた匿名アカウントはログイン済みとして扱わない。
  onAuthStateChanged(auth, async user => {
    if(authBusy) return;
    if(user && !user.isAnonymous && user.emailVerified){ launchApp(); return; }
    if(user && user.isAnonymous){
      authBusy = true;
      try { await signOut(auth); } catch (e) { console.error(e); }
      authBusy = false;
    }
    if(!started && !isSignInWithEmailLink(auth, location.href)) renderEmailLogin();
  });
  if(isSignInWithEmailLink(auth, location.href)) await finishEmailLink();
}
initEmailAuth().catch(e => renderEmailLogin(authErrorText(e)));

/* =========================================================
   初期設定（最初に1回だけ：管理ページを作る）
   ========================================================= */
function renderSetup(){
  $app.innerHTML = `
    <header class="top"><div><div class="kicker">打ち合わせ日程</div><h1>はじめに</h1></div></header>
    <div class="hint">グループLINEのメンバーの方は、グループLINEに貼られたURLから開いてください。</div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:6px">管理者の方へ</div>
      <div style="font-size:14px;line-height:1.7;color:var(--sub)">
        最初に1回だけ「管理ページ」を作ります。作成後に表示されるURLは<b>あなた専用</b>です。ブックマークやLINEのKeepメモに保存してください。
      </div>
      <button class="btn primary block" style="margin-top:12px" id="mkAdmin">管理ページを作成する</button>
    </div>`;
  document.getElementById('mkAdmin').onclick = async (ev) => {
    ev.target.disabled = true; ev.target.textContent = '作成中…';
    try{
      const key = rid(28);
      await setDoc(doc(db, ADMINS, key), { groups: [], ownerUid: auth.currentUser.uid, createdAt: Date.now() });
      location.replace(`${BASE}?admin=${key}&first=1`);
    }catch(e){ showError(e); ev.target.disabled = false; ev.target.textContent = '管理ページを作成する'; }
  };
}

/* =========================================================
   管理ページ（全グループの一覧）
   ========================================================= */
let A = null;          // admins/{key} の中身
let AG = {};           // gid -> group data
async function initAdmin(key){
  try{
    const snap = await getDoc(doc(db, ADMINS, key));
    if(!snap.exists()){ $app.innerHTML = `<div class="empty">管理ページが見つかりません。<br>URLをもう一度確認してください。</div>`; return; }
    A = snap.data();
    await loadAdminGroups();
    renderAdmin();

function nextMeeting(g){
  const t = todayStr();
  return (g.meetings || []).filter(m => m.date >= t).sort(cmpMeet)[0] || null;
}

    <div class="footer-links"><button class="linkbtn" id="copyAdmin2">この管理ページのURLをコピー</button></div>`;

  document.getElementById('reload').onclick = async () => { toast('更新中…'); try{ const s = await getDoc(doc(db,ADMINS,ADMIN)); A = s.data(); await loadAdminGroups(); renderAdmin(); toast('最新の状態です'); }catch(e){ showError(e); } };

let G = null;
async function initGroup(gid){
  // この20文字のグループIDが招待トークンとして機能します。
  // 認証済み本人の会員ドキュメントだけを作成できます。
  try {
    if (!/^[a-zA-Z0-9]{20}$/.test(gid)) throw new Error('invalid-group-id');
    const user = auth.currentUser;
    if (!user || !user.emailVerified) throw new Error('email-required');
    const membership = doc(db, GROUPS, gid, 'memberships', user.uid);
    const existing = await getDoc(membership);
    if (!existing.exists()) {
      await setDoc(membership, { uid: user.uid, email: user.email, joinedAt: Date.now() });
    }
  } catch(e) {
    console.error('グループ登録エラー', e);
    $app.innerHTML = '<div class="empty">このグループに登録できませんでした。<br>招待URLが正しいか確認してください。</div>';
    return;
  }
  onSnapshot(doc(db, GROUPS, gid), snap => {
    if(!snap.exists()){ $app.innerHTML = `<div class="empty">このページは見つかりませんでした。<br>グループLINEに貼られたURLをもう一度開いてください。</div>`; return; }
    G = snap.data();
    if(!$modal.classList.contains('hidden') && $modal.dataset.keep) return; // 入力中は画面を書き換えない
    renderGroup();
  }, err => { console.error(err); $app.innerHTML = `<div class="empty">読み込めませんでした。<br>通信状況を確認して、ページを再読み込みしてください。</div>`; });
}
const meKey = () => `mtg_me_${GID}`;
const getMe = () => store(meKey()) || '';

function ensureMe(){

}
function askMe(){

// 最新のデータを読み直してから変更して保存（同時編集で上書きされないように）
async function mutate(fn){
  const ref = doc(db, GROUPS, GID);
  const auditRef = doc(collection(db, 'audit_secure_test'));
const actor = auth.currentUser;
if (!actor || !actor.emailVerified) throw new Error('認証が必要です');
  let result;
  await runTransaction(db, async tx => {
    const s = await tx.get(ref);
    if(!s.exists()) throw new Error('notfound');
    const d = s.data();
    const adminId = d.adminId;
    const before = structuredClone(d);
    d.meetings = d.meetings || []; d.members = d.members || [];
    result = fn(d);
    if(result === false) return;
    d.updatedAt = Date.now();
    tx.set(ref, d);
    tx.set(auditRef, {
  groupId: GID,
  adminId: adminId,
  actorUid: actor.uid,
  actorEmail: actor.email,
  at: Date.now(),
  action: 'グループ情報を更新',
  before: before,
  after: structuredClone(d)
});
  });
  return result;
}

function meetingCard(m, isPast){
  const t = todayStr();
  const inN = m.participants.filter(p => p.status !== 'out').length;
  const outN = m.participants.length - inN;
  const changed = !isPast && isRecent(m.changedAt) && m.changedAt !== m.createdAt;
  const chips = m.participants.map(p => {
    const out = p.status === 'out';
    return `<button class="chip ${out ? 'out' : ''}" data-act="toggle" data-id="${esc(m.id)}" data-name="${esc(p.name)}">${esc(p.name)}<span class="mark">${out ? '×' : '○'}</span></button>`;
  }).join('');
  let meta = '';
  if(m.changedAt && m.changedAt !== m.createdAt) meta = `${fmtStamp(m.changedAt)} ${esc(m.changedBy || 'だれか')}さんが日時・内容を変更`;
  else if(m.createdAt) meta = `${fmtStamp(m.createdAt)} ${esc(m.createdBy || 'だれか')}さんが追加`;
  return `<div class="card ${changed ? 'changed' : ''}">
    <div class="when">${esc(fmtDate(m.date).replace(/\(.\)$/, ''))}<span class="dow">${esc((fmtDate(m.date).match(/\(.\)$/) || [''])[0])}</span>${m.time ? `<span class="time">${esc(m.time)}〜</span>` : ''}
      ${m.date === t ? '<span class="badge today">今日</span>' : ''}${changed ? '<span class="badge changed">変更あり</span>' : ''}</div>
    ${m.place ? `<div class="place">📍 ${esc(m.place)}</div>` : ''}
    ${m.url ? (isUrl(m.url)
      ? `<div class="joinurl">
          <div class="jt">💻 オンラインで参加する方はこちら</div>
          <a class="open" href="${esc(m.url.trim())}" target="_blank" rel="noopener">▶ ${meetService(m.url) ? esc(meetService(m.url)) + 'の' : ''}会議に入る</a>
          <div class="jh">時間になったら上のボタンを押すと、そのまま会議に入れます。<br>（出欠の登録は、下の名前のボタンでします）</div>
          <div class="ur"><span class="u">${esc(m.url)}</span><button data-act="copyurl" data-id="${esc(m.id)}">URLをコピー</button></div>
        </div>`
      : `<div class="place">🔗 ${esc(m.url)}</div>`) : ''}
    ${m.memo ? `<div class="memo">${esc(m.memo)}</div>` : ''}
    ${m.participants.length && !isPast ? `<div class="absent-hint">👆 <b>欠席の方は、ご自分のお名前を押してください。</b><br>「欠席 ×」に変わります（もう一度押すと参加に戻ります）</div>` : ''}
    ${m.participants.length ? `<div class="people">${chips}</div><div class="count">参加 ${inN} ・ 欠席 ${outN}</div>` : `<div class="memo">参加者がまだいません</div>`}
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    <div class="actions"><button class="btn small ghost" data-act="edit" data-id="${esc(m.id)}">✏️ 日時・内容を変更</button></div>
  </div>`;
}

      const res = await mutate(d => {
        const now = Date.now();
        people.forEach(n => { if(!d.members.includes(n)) d.members.push(n); });
        if(isNew){
          const nm = { id: rid(10), date, time, place, url, memo, participants: people.map(n => ({ name: n, status: 'in' })),
                       createdAt: now, createdBy: me, changedAt: now, changedBy: me };
          d.meetings.push(nm);
          d.lastChange = { at: now, by: me, text: `予定を追加：${fmtWhen(nm)}` };
          return { kind: 'add', after: nm };
        }
        const cur = d.meetings.find(x => x.id === id);
        if(!cur) throw new Error('deleted');
        const before = { ...cur };
        const prev = new Map(cur.participants.map(p => [p.name, p.status]));
        cur.participants = people.map(n => ({ name: n, status: prev.get(n) || 'in' }));
        const scheduleChanged = cur.date !== date || (cur.time || '') !== time || (cur.place || '') !== place;
        const urlChanged = (cur.url || '') !== url;
        Object.assign(cur, { date, time, place, url, memo });
        cur.changedAt = now; cur.changedBy = me;
        d.lastChange = { at: now, by: me, text: scheduleChanged ? `日時・場所を変更：${fmtWhen(before)} → ${fmtWhen(cur)}` : urlChanged ? `${fmtWhen(cur)} の参加用URLを変更` : `${fmtWhen(cur)} の内容を変更` };
        return { kind: scheduleChanged ? 'move' : urlChanged ? 'url' : 'edit', before, after: { ...cur } };
      });
      delete $modal.dataset.keep; closeModal(); renderGroup();
      offerNotify(res);
    }catch(e){
      if(e.message === 'deleted'){ toast('この予定は他の人に削除されていました'); delete $modal.dataset.keep; closeModal(); renderGroup(); return; }
      showError(e); ev.target.disabled = false; ev.target.textContent = '保存';
    }
  };

  const del = document.getElementById('del');
  if(del) del.onclick = async () => {
    if(!del.classList.contains('armed')){ del.classList.add('armed'); del.textContent = 'もう一度押すと削除します'; return; }
    const me = await ensureMe(); if(!me) return;
    try{
      const res = await mutate(d => {
        const cur = d.meetings.find(x => x.id === id); if(!cur) return false;
        d.meetings = d.meetings.filter(x => x.id !== id);
        d.lastChange = { at: Date.now(), by: me, text: `予定を削除：${fmtWhen(cur)}` };
        return { kind: 'delete', before: cur };
      });
      delete $modal.dataset.keep; closeModal(); renderGroup();
      if(res) offerNotify(res);
    }catch(e){ showError(e); }
  };
}

let _urlWarned = '';
function confirmUrlOnce(u){
  if(_urlWarned === u) return true;
  _urlWarned = u;
  toast('参加用URLが「https://」で始まっていません。このままでよければ、もう一度「保存」を押してください');
  return false;
}

function offerNotify(res){
  if(!res) return;
  if(res.kind === 'edit'){ toast('保存しました'); return; }
  const lines = [`【${G.name}】打ち合わせのお知らせ`];
  if(res.kind === 'add'){
    lines.push(`📅 予定を追加しました`, placeLine(res.after) + urlLine(res.after));
  }else if(res.kind === 'move'){
    lines.push(`🔁 日時・場所が変わりました`, `変更前：${placeLine(res.before)}`, `変更後：${placeLine(res.after)}` + urlLine(res.after));
  }else if(res.kind === 'url'){
    lines.push(`🔗 参加用URLが変わりました`, placeLine(res.after), res.after.url ? `新しいURL：${res.after.url}` : '（参加用URLは削除されました）');
  }else if(res.kind === 'delete'){
    lines.push(`🗑 次の予定は中止（削除）になりました`, placeLine(res.before));
  }
  lines.push('', '来られない人は自分の名前をタップして×にしてください', groupUrl(GID));
  const text = lines.join('\n');
  openModal(`<h2>保存しました ✅</h2>
    <div class="notice">⚠️ <b>まだ参加者の皆さんには伝わっていません。</b><br>このページで変更しても通知は届かないので、下のボタンで<b>グループLINEにお知らせしてください。</b></div>
    <div class="preview">${esc(text)}</div>
    ${shareButtons(text, 'グループLINEで知らせる', '自分でLINEに書くので閉じる')}`);
  const ln = document.getElementById('ln'); if(ln) ln.addEventListener('click', () => setTimeout(closeModal, 300));
  document.getElementById('cp').onclick = () => copyText(text);
  document.getElementById('cl').onclick = closeModal;
}

function openMembers(){
  $modal.dataset.keep = '1';
  openModal(`<h2>グループ名・メンバー名簿</h2>
    <div class="field"><label>グループ名</label><input type="text" id="gname" value="${esc(G.name)}"></div>
    <div class="field"><label>メンバー名簿（1行に1人）</label><textarea id="gmem" style="min-height:160px">${esc((G.members || []).join('\n'))}</textarea>
      <div class="meta">名簿は「予定を追加」で参加者を選ぶときの候補になります。名簿から消しても、すでに入っている予定からは消えません。</div></div>
    <div class="btns"><button class="btn ghost" id="cl">キャンセル</button><button class="btn primary" id="ok">保存</button></div>`);
  const close = () => { delete $modal.dataset.keep; closeModal(); renderGroup(); };
  document.getElementById('cl').onclick = close;
  document.getElementById('ok').onclick = async () => {
    const name = document.getElementById('gname').value.trim();
    if(!name){ toast('グループ名を入れてください'); return; }
    const members = splitNames(document.getElementById('gmem').value);
    const me = await ensureMe(); if(!me) return;
    try{
      await mutate(d => { d.name = name; d.members = members; d.lastChange = { at: Date.now(), by: me, text: 'グループ名・名簿を編集' }; });
      close(); toast('保存しました');
    }catch(e){ showError(e); }
  };
}
</script>
