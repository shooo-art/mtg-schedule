const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app), uid='egFnqDGZaUYT1xZMPJMMBX54NWo1', aid='4CKMtw7EDe2XuZkRkkeEvWPHxCYE';
